name: LinkedIn Job Scraper Auto Bot

on:
  schedule:
    # Berjalan otomatis setiap 2 jam (UTC time)
    - cron: '0 */2 * * *'
  # Bisa dijalankan manual lewat tombol 'Run workflow' di GitHub
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          SEARCH_KEYWORDS: ${{ secrets.SEARCH_KEYWORDS || 'fresh graduate administration,data entry staff,management trainee,operational staff,junior project coordinator,general affairs staff' }}
          SEARCH_LOCATION: ${{ secrets.SEARCH_LOCATION || 'Indonesia' }}
        run: |
          python main.py
